<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KWT-STAR · 关键词识别上位机</title>
  <link rel="stylesheet" href="console.css">
  <script src="../an970_gui/dataset.js" defer></script>
  <script src="replay.js" defer></script>
  <script src="board.js" defer></script>
  <script src="console.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="art-slice competition-logo" role="img" aria-label="共创芯未来"></span>
        <div class="project-brand"><strong>KWT-STAR</strong><span>上位机</span></div>
      </div>
      <p class="team-heading"><strong>芯希望</strong><span>30054</span></p>
      <div class="topbar-actions">
        <span class="art-slice sponsor-logo" role="img" aria-label="南京集成电路产业服务中心"></span>
        <span class="mode"><span class="mode-dot"></span><span id="run-mode">离线评测回放</span></span>
        <button type="button" id="projection" aria-pressed="false">进入投屏</button>
      </div>
    </div>
  </header>

  <main class="workbench">
    <div class="page-heading">
      <h1>语音关键词识别</h1>
      <p><strong>W4</strong><span id="sample-scope">600 条样本 · 12 类</span></p>
    </div>

    <div class="main-grid">
      <section class="panel samples" aria-labelledby="sample-title">
        <div class="section-heading">
          <h2 id="sample-title">评委抽样</h2>
          <button class="primary" type="button" id="draw">随机抽取</button>
        </div>

        <div class="sample-heading">
          <div>
            <p class="micro">当前样本</p>
            <p class="sample-id" id="sample-id"># —</p>
          </div>
          <form id="sample-form" class="sample-form">
            <label for="sample-number">指定编号</label>
            <div>
              <input id="sample-number" placeholder="000–599" type="text" inputmode="numeric" maxlength="3" pattern="[0-9]{1,3}" required>
              <button type="submit" id="select">选取</button>
            </div>
          </form>
        </div>

        <figure class="audio-view">
          <figcaption><span>语音波形</span><span id="sample-state" role="status">等待抽样</span></figcaption>
          <canvas id="waveform" width="760" height="104" role="img" aria-label="样本语音波形"></canvas>
          <div class="time-scale"><span>0.00 s</span><span id="duration">—</span></div>
        </figure>

        <div class="playback-bar">
          <button class="play" type="button" id="play" disabled>播放并揭晓</button>
        </div>
      </section>

      <section class="panel recognition" aria-labelledby="result-title">
        <div class="section-heading">
          <h2 id="result-title">识别结果</h2>
          <span class="verdict" id="verdict" hidden></span>
        </div>
        <div class="prediction-view" aria-live="polite">
          <p class="prediction waiting" id="prediction">—</p>
          <p class="meaning" id="meaning">等待播放</p>
        </div>
        <div class="truth"><span id="truth-label">真实标签</span><strong id="truth">—</strong></div>
      </section>
    </div>

    <div class="lower-grid">
      <section class="panel hardware" aria-labelledby="hardware-title">
        <div class="section-heading">
          <h2 id="hardware-title">板端监测</h2>
          <div class="board-controls">
            <span id="board-link" class="disconnected" role="status">FPGA 未接入</span>
            <button type="button" id="board-switch" hidden>连接 J8</button>
          </div>
        </div>
        <ol id="layers" class="layers" aria-label="12 层编码器状态"></ol>
        <p id="board-cases" class="board-cases" hidden></p>
        <dl class="telemetry">
          <div><dt>板上周期</dt><dd id="board-cycles">—</dd></div>
          <div><dt>板上耗时</dt><dd id="board-time">—</dd></div>
          <div><dt id="check-label">末层校验</dt><dd id="board-check">—</dd></div>
        </dl>
      </section>

      <section class="panel record" aria-labelledby="record-title">
        <div class="section-heading"><h2 id="record-title">本场记录</h2><span id="record-count">0 次</span></div>
        <p id="empty-record">完成一次识别或回放后显示记录</p>
        <div class="record-scroll" id="record-table" hidden>
          <table>
            <thead><tr><th scope="col">样本</th><th scope="col">识别</th><th scope="col">真实</th><th scope="col">来源</th><th scope="col">比对</th></tr></thead>
            <tbody id="record-rows"></tbody>
          </table>
        </div>
      </section>
    </div>
    <audio id="audio" preload="none"></audio>
  </main>
</body>
</html>
